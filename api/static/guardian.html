  <p>${esc(now ? t("nowText") : t("emText"))}</p>${now ? `<a class="call" href="tel:103">${esc(t("call"))}</a>` : ""}</div></div>`;
const head = () => `<p class="eyebrow">${esc(t("eyebrow"))}</p><h1>${esc(t("title"))}</h1><p class="lead">${esc(t("lead"))}</p>
  <div class="progress"><span>${esc(t("of", { i: Math.min(step + 1, N), n: N }))}</span><small>${esc(today())}</small></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${step}"><span style="width:${(step / N) * 100}%"></span></div>`;

function render() {
  document.documentElement.lang = lang; $("lang").value = lang;
  document.title = `CardioPath — ${t("title")}`;
  const m = $("main");
  if (authOn && !session) return renderLogin();
  if (!episodeId) { m.innerHTML = `<h1>${esc(t("title"))}</h1><p class="lead">${esc(t("noEp"))}</p>${emergency(false)}`; return; }
  if (step < QUESTIONS.length) {
    const q = QUESTIONS[step], [title, help] = T[lang].q[q.code], a = answers[q.code];
    const showNow = q.urgent && a === "yes";      // jiddiy belgi: ko'rsatma darhol, yuborishni kutmasdan
    m.innerHTML = `${head()}<div class="g-step"><div class="q-icon">${HEART}</div>
      <fieldset style="border:0;padding:0;margin:0"><legend class="cp-guardian__question">${esc(title)}</legend><p class="q-help">${esc(help)}</p>
        ${["yes", "no", "unsure"].map((v) => `<label class="cp-guardian__choice"><input type="radio" name="a" value="${v}" ${a === v ? "checked" : ""}>${esc(t(v))}</label>`).join("")}</fieldset></div>
      ${showNow ? emergency(true) : ""}
      <div class="nav-row">${step > 0 ? `<button class="cp-btn cp-btn--secondary" type="button" id="back" style="min-height:56px">${esc(t("back"))}</button>` : "<span></span>"}
        <button class="cp-btn cp-guardian__submit" type="button" id="next" ${a ? "" : "disabled"}>→ ${esc(t("next"))}</button></div>
      ${showNow ? "" : emergency(false)}<p class="foot">${esc(t("safety"))}</p>`;
    m.querySelectorAll("input[name=a]").forEach((r) => r.addEventListener("change", () => { answers[q.code] = r.value; render(); const g = m.querySelector(".g-step"); if (g) g.style.animation = "none"; m.querySelector("input:checked").focus(); }));
    $("next").onclick = () => { step++; render(); window.scrollTo({ top: 0 }); };
  } else if (step === INR_STEP) {
    renderInr(m);
  } else if (step === MEASURE_STEP) {
    const f = (k, min, max, st) => `<div class="cp-field"><label class="cp-field__label" for="${k}">${esc(t({ weight_kg: "weight", temperature_c: "temp", heart_rate: "pulse", spo2: "spo2" }[k]))}</label>
      <input class="cp-input" id="${k}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${st}" value="${esc(measures[k])}"></div>`;
    m.innerHTML = `${head()}<div class="q-icon">${HEART}</div><h2 class="cp-guardian__question">${esc(t("measures"))}</h2><p class="q-help">${esc(t("measuresHelp"))}</p>
      <div class="num-grid">${f("weight_kg", 1, 399, .1)}${f("temperature_c", 30, 45, .1)}${f("heart_rate", 20, 250, 1)}${f("spo2", 50, 100, 1)}</div>
      <p class="cp-field__error err" id="err" role="alert"></p>
      <div class="nav-row"><button class="cp-btn cp-btn--secondary" type="button" id="back" style="min-height:56px">${esc(t("back"))}</button>
        <button class="cp-btn cp-guardian__submit" type="button" id="send">${esc(inrIndication ? "→ " + t("next") : t("send"))}</button></div>${emergency(false)}`;
    Object.keys(measures).forEach((k) => { $(k).oninput = (e) => { measures[k] = e.target.value; }; });
    $("send").onclick = inrIndication ? () => { step++; render(); window.scrollTo({ top: 0 }); } : send;
  }
  if ($("back")) $("back").onclick = () => { step--; render(); };
}

function renderInr(m) {
  const confirmBox = inr.mode === "photo" && inr.value && !inr.confirmed
    ? `<div class="emergency" style="border-color:var(--cp-brand);background:var(--cp-info-bg);color:var(--cp-ink)"><div><b>${esc(t("inrConfirm", { v: inr.value }))}</b><p>${esc(t("inrConfirmHelp"))}</p>
        <div class="nav-row" style="grid-template-columns:1fr 1fr"><button class="cp-btn" type="button" id="inrYes">${esc(t("inrYes"))}</button><button class="cp-btn cp-btn--secondary" type="button" id="inrFix">${esc(t("inrFix"))}</button></div></div></div>` : "";
  const typeBox = inr.mode === "type" || (inr.mode === "photo" && inr.confirmed)
    ? `<div class="cp-field" style="margin-top:1rem"><label class="cp-field__label" for="inrVal">${esc(t("inrValue"))}</label>
        <input class="cp-input" id="inrVal" type="number" inputmode="decimal" min="0.8" max="12" step="0.1" value="${esc(inr.value)}" style="font-size:1.4rem;min-height:58px" ${inr.confirmed ? "readonly" : ""}></div>` : "";
  m.innerHTML = `${head()}<div class="g-step"><div class="q-icon">${HEART}</div><h2 class="cp-guardian__question">${esc(t("inrQ"))}</h2><p class="q-help">${esc(t("inrHelp"))}</p>
      ${["photo", "type", "none"].map((v) => `<label class="cp-guardian__choice"><input type="radio" name="inrm" value="${v}" ${inr.mode === v ? "checked" : ""}>${esc(t({ photo: "inrPhoto", type: "inrType", none: "inrNo" }[v]))}</label>`).join("")}
      <input type="file" id="inrFile" accept="image/*" capture="environment" hidden>
      <p class="q-help" id="inrMsg" role="status"></p>${confirmBox}${typeBox}
      <p class="q-help">${esc(t("inrDose"))}</p></div>
    <p class="cp-field__error err" id="err" role="alert"></p>
    <div class="nav-row"><button class="cp-btn cp-btn--secondary" type="button" id="back" style="min-height:56px">${esc(t("back"))}</button>
      <button class="cp-btn cp-guardian__submit" type="button" id="send" ${inr.mode && (inr.mode === "none" || inr.value) && !(inr.mode === "photo" && !inr.confirmed) ? "" : "disabled"}>${esc(t("send"))}</button></div>${emergency(false)}`;
  m.querySelectorAll("input[name=inrm]").forEach((r) => r.addEventListener("change", () => {
    inr.mode = r.value; inr.value = ""; inr.confirmed = false; inr.ocrText = "";
    if (r.value === "photo") $("inrFile").click();
    render(); const g = m.querySelector(".g-step"); if (g) g.style.animation = "none";
  }));
  if ($("inrFile")) $("inrFile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    $("inrMsg").textContent = t("inrReading");
    try {
      const fd = new FormData(); fd.append("file", f);
      const headers = {}; if (session) headers.Authorization = "Bearer " + session.token;
      const r = await (await fetch(`/episodes/${encodeURIComponent(episodeId)}/guardian/inr-read`, { method: "POST", headers, body: fd })).json();
      if (r.value) { inr.value = String(r.value); inr.ocrText = r.text || ""; }
      else { inr.mode = "type"; }
    } catch (err) { inr.mode = "type"; }
    render(); if (inr.mode === "type") $("inrMsg").textContent = t("inrNotRead");
  };
  if ($("inrYes")) $("inrYes").onclick = () => { inr.confirmed = true; render(); };
  if ($("inrFix")) $("inrFix").onclick = () => { inr.mode = "type"; inr.value = ""; inr.ocrText = ""; render(); };
  if ($("inrVal")) $("inrVal").oninput = (e) => { inr.value = e.target.value; $("send").disabled = !e.target.value; };
  $("send").onclick = send;
}

async function send() {
  const btn = $("send"); btn.disabled = true; btn.textContent = t("sending"); $("err").textContent = "";
  const pick = (group, v) => QUESTIONS.filter((q) => q.group === group && answers[q.code] === v).map((q) => q.code);
  const num = (k) => measures[k] === "" ? null : Number(measures[k]);
  const body = { actor: session ? session.user.username : "patient", questionnaire: true, symptoms: pick("symptoms", "yes"), unsure_symptoms: pick("symptoms", "unsure"),
    wound_signs: pick("wound", "yes"), unsure_wound_signs: pick("wound", "unsure"), fever: answers.fever === "yes",
    weight_kg: num("weight_kg"), temperature_c: num("temperature_c"), heart_rate: num("heart_rate"), spo2: num("spo2") };
  try {
    const headers = { "Content-Type": "application/json" }; if (session) headers.Authorization = "Bearer " + session.token;
    const r = await fetch(`/episodes/${encodeURIComponent(episodeId)}/guardian/checkin`, { method: "POST", headers, body: JSON.stringify(body) });
    if (r.status === 409) { $("err").textContent = t("errStage"); btn.disabled = false; btn.textContent = t("retry"); return; }
    if (!r.ok) throw new Error(String(r.status));
    let esc1 = (await r.json()).escalation;
    if (inrIndication && inr.mode !== "none" && inr.value) {
      const r2 = await fetch(`/episodes/${encodeURIComponent(episodeId)}/guardian/inr`, { method: "POST", headers,
        body: JSON.stringify({ actor: body.actor, indication: inrIndication, value: Number(inr.value), ocr_text: inr.ocrText || null }) });
      if (!r2.ok) throw new Error(String(r2.status));
      const esc2 = (await r2.json()).escalation, rank = { green: 0, amber: 1, red: 2 };
      esc1 = { alert: rank[esc2.alert] > rank[esc1.alert] ? esc2.alert : esc1.alert,
               notified: (esc1.alert === "green" || esc1.notified) && (esc2.alert === "green" || esc2.notified) };
    }
    showResult(esc1, Object.values(answers).includes("unsure"));
  } catch (e) { $("err").textContent = t("errSend"); btn.disabled = false; btn.textContent = t("retry"); }
}

function showResult(esc_, unsure) {
  const lvl = esc_.alert, cls = lvl === "red" ? "result--red" : lvl === "amber" ? "result--amber" : "";
  const icon = lvl === "red" ? "!" : lvl === "amber" ? "!" : "✓";
  // natija darhol, animatsiyasiz; tashxis, raqam yoki AI so'zi ko'rsatilmaydi
  $("main").innerHTML = `<div class="result ${cls}" role="status" ${lvl === "red" ? "data-clinical-urgent" : ""}><div class="big-icon" aria-hidden="true">${icon}</div>
      <h2>${esc(t("r_" + lvl + "_t"))}</h2><p>${esc(t("r_" + lvl))}</p>
      ${unsure ? `<p>${esc(t("r_unsure"))}</p>` : ""}
      ${lvl !== "green" && !esc_.notified ? `<p><b>${esc(t("r_notSent"))}</b></p>` : ""}
      ${lvl === "red" ? `<a class="call" href="tel:103">${esc(t("call"))}</a>` : ""}</div>
    ${lvl === "red" ? "" : emergency(false)}
    <button class="cp-btn cp-btn--secondary cp-btn--block" type="button" id="again" style="margin-top:1rem;min-height:56px">${esc(t("again"))}</button>`;
  $("again").onclick = () => { for (const k in answers) delete answers[k]; Object.keys(measures).forEach((k) => { measures[k] = ""; });
    Object.assign(inr, { mode: null, value: "", ocrText: "", confirmed: false }); step = 0; render(); };
}

function renderLogin() {
  $("main").innerHTML = `<h1>${esc(t("loginTitle"))}</h1><form id="lf" class="cp-stack" style="margin-top:1rem">
    <div class="cp-field"><label class="cp-field__label" for="lu">${esc(t("username"))}</label><input class="cp-input" id="lu" autocomplete="username" required></div>
    <div class="cp-field"><label class="cp-field__label" for="lp">${esc(t("password"))}</label><input class="cp-input" id="lp" type="password" autocomplete="current-password" required></div>
    <p class="cp-field__error" id="le" role="alert"></p><button class="cp-btn cp-guardian__submit" type="submit">${esc(t("signIn"))}</button></form>${emergency(false)}`;
  $("lf").onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("lu").value.trim(), password: $("lp").value }) });
    if (!r.ok) { $("le").textContent = t("loginBad"); return; }
    const b = await r.json(); session = { token: b.token, user: b.user, permissions: b.permissions };
    try { sessionStorage.setItem("auth", JSON.stringify(session)); } catch (err) { /* */ }
    episodeId = b.user.episode_id || episodeId; render();
  };
}

$("lang").onchange = (e) => { lang = e.target.value; store.set("lang", lang); render(); };
(async () => {
  try { authOn = (await (await fetch("/auth/status")).json()).enabled; } catch (e) { /* */ }
  if (authOn && session && session.user.episode_id) episodeId = session.user.episode_id;   // bemor faqat o'z epizodi
  render();
})();
})();
</script>
</body>
</html>
