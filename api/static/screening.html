<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardioPath AI</title>
<link rel="stylesheet" href="/static/cardiopath.css?v=20261102c">
<script defer src="/static/cardiopath.js?v=20261102c"></script>
<style>
  /* Clinical Precision tokenlari (cardiopath.css) — eski nomlar ko'prik orqali; yorug'/qorong'i mavzu u yerda */
  :root {
    --bg: var(--cp-canvas); --bg2: var(--cp-surface-2); --card: var(--cp-surface); --text: var(--cp-ink); --muted: var(--cp-ink-muted);
    --border: var(--cp-border); --accent: var(--cp-brand); --accent2: var(--cp-brand); --on-accent: var(--cp-brand-on);
    --shadow: var(--cp-shadow-1); --sil: var(--cp-border);
    --green: var(--cp-success); --green-bg: var(--cp-success-bg); --yellow: var(--cp-warning); --yellow-bg: var(--cp-warning-bg);
    --red: var(--cp-danger); --red-bg: var(--cp-danger-bg); --grey: var(--cp-abstain); --grey-bg: var(--cp-abstain-bg);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); min-height: 100vh; }
  main { max-width: 1040px; margin: 0 auto; padding: 14px 16px 72px; }

  /* yuqori panel */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0 14px; }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand .logo { width: 40px; height: 40px; flex: none; }
  .brand b { display: block; font-size: 20px; line-height: 1.1; }
  .brand small { display: block; font-size: 12px; color: var(--muted); }
  .tools { display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; box-shadow: var(--shadow); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; min-height: 40px; min-width: 44px;
                padding: 0 10px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }
  .theme { width: 46px; min-height: 46px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text);
           font-size: 18px; cursor: pointer; box-shadow: var(--shadow); }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, label.pick:focus-within, .pt:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }

  /* hero */
  .hero { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--border);
          border-radius: 18px; padding: 22px 22px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .ecg { width: 100%; max-width: 520px; height: auto; display: block; margin: -4px 0 6px -4px; }
  .ecg .line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; animation: ecg 1.2s var(--cp-ease-out) 1 both; }
  .ecg .heart { fill: none; stroke: var(--accent); stroke-width: 3; transform-origin: 260px 46px; }
  .ecg .bar { fill: var(--accent2); }
  @keyframes ecg { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
  .hero h1 { font-size: 30px; line-height: 1.15; margin: 4px 0 8px; max-width: 560px; }
  .hero p { color: var(--muted); margin: 0 0 14px; max-width: 600px; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px 12px 6px 6px; }
  .chip i { font-style: normal; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--bg2); color: var(--accent); font-size: 16px; }
  details.how { margin-top: 12px; } details.how summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); }
  details.how ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }

  .banner { width: 100%; text-align: left; background: var(--card); border: 1px dashed var(--accent); color: var(--accent); border-radius: 12px;
            padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; margin-bottom: 14px; min-height: 46px; }

  /* kartalar va maydonlar */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .card h2, .card h3 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .tag.req { color: var(--red); border-color: var(--red); }
  .hint { font-size: 14px; color: var(--muted); margin: 2px 0 12px; }
  label.f { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password], select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
         background: var(--bg); color: var(--text); font: inherit; min-height: 46px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 10px; }
  .age { display: flex; gap: 6px; } .age input { flex: 1; min-width: 0; } .age select { width: 92px; }
  .flags { display: grid; grid-template-columns: 1fr; gap: 2px; }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; font-size: 15px; cursor: pointer; }
  .chk input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
  .major { font-size: 11px; color: var(--red); border: 1px solid var(--red); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }

  /* auskultatsiya: torso + nuqtalar */
  .auscult { display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: start; }
  .torso { position: relative; width: 190px; aspect-ratio: 240 / 260; }
  .torso svg { width: 100%; height: 100%; display: block; }
  .torso .sil { fill: var(--sil); } .torso .ln { stroke: var(--muted); stroke-dasharray: 3 4; opacity: .5; fill: none; }
  .torso .hrt { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 1; opacity: .8; }
  .pt { position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; border: 2px solid var(--card); background: var(--c);
        color: #fff; font: 700 11px/1 system-ui; cursor: pointer; display: grid; place-items: center; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .pt::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; }
  .pt:hover::after, .pt:focus-visible::after { opacity: .6; }
  .pt[data-state=ok] { background: var(--green); color: var(--card); }
  .pt[data-state=short] { background: var(--yellow); color: var(--card); }
  .lrow { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .lrow:last-child { border-bottom: 0; }
  .ldot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); margin-top: 6px; }
  .linfo b { display: block; font-size: 15px; } .where { font-size: 12.5px; color: var(--muted); }
  .lfile { display: flex; align-items: center; gap: 4px; }
  .pick { border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; }
  .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; min-width: 40px; min-height: 40px; }
  .wave { margin-top: 6px; }
  .fname { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .wrow { display: flex; align-items: center; gap: 8px; }
  .bars { width: 140px; height: 26px; fill: var(--accent); } .dur { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ok-chip { font-size: 12.5px; color: var(--green); font-weight: 600; } .warn-chip { font-size: 12.5px; color: var(--yellow); font-weight: 600; }

  .btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 12px 22px; font: inherit;
         font-weight: 700; cursor: pointer; min-height: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.wide { width: 100%; font-size: 17px; }
  .btn:disabled { opacity: .7; cursor: wait; }
  .wv span { display: inline-block; width: 3px; height: 16px; margin: 0 1.5px; background: currentColor; border-radius: 2px; animation: wv .9s ease-in-out infinite; }
  .wv span:nth-child(2) { animation-delay: .15s; } .wv span:nth-child(3) { animation-delay: .3s; } .wv span:nth-child(4) { animation-delay: .45s; }
  @keyframes wv { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1.2); } }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .err { border-left: 6px solid var(--red); background: var(--red-bg); margin-top: 14px; }
  .err b { color: var(--red); }

  /* natija */
  .subbar { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; }
  .subbar h2 { margin: 0; font-size: 22px; }
  .back { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 20px; cursor: pointer; }
  .verdict { --st: var(--grey); border: 1px solid var(--st); border-left: 10px dashed var(--st); border-radius: 16px; padding: 20px; background: var(--grey-bg);
             box-shadow: var(--shadow); animation: cp-fade var(--cp-motion-fast) var(--cp-ease-out) both; margin-bottom: 16px; }
  .verdict.lv-red { --st: var(--red); background: var(--red-bg); border-left-style: solid; animation: none; }
  .verdict.lv-yellow { --st: var(--yellow); background: var(--yellow-bg); border-left-style: solid; }
  .verdict.lv-green { --st: var(--green); background: var(--green-bg); border-left-style: solid; }
  .vh { display: flex; gap: 16px; align-items: center; }
  .ico { flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: var(--card); background: var(--st); }
  .headline { font-size: 24px; font-weight: 800; line-height: 1.2; margin: 0; color: var(--st); }
  .support { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  .todo-l { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 2px; }
  .todo { font-size: 18px; margin: 0; }
  .attn { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--yellow); }
  .meta { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  ul.items { list-style: none; margin: 8px 0 0; padding: 0; }
  .it { --st: var(--grey); display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .it:last-child { border-bottom: 0; }
  .it.lv-red { --st: var(--red); } .it.lv-yellow { --st: var(--yellow); } .it.lv-green { --st: var(--green); }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: 2px; background: var(--st); color: var(--card);
         display: grid; place-items: center; font-size: 13px; font-weight: 800; line-height: 1; }
  .stepper { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; }
  .stepper li { position: relative; text-align: center; font-size: 12.5px; color: var(--muted); padding: 0 2px; }
  .stepper li::after { content: ""; position: absolute; top: 16px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 2px; background: var(--border); }
  .stepper li:nth-child(4n)::after { display: none; }
  .stepper .n { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 4px; display: grid; place-items: center; border: 2px solid var(--border); background: var(--card); font-weight: 700; color: var(--muted); }
  .stepper li.cur { color: var(--text); font-weight: 700; }
  .stepper li.cur .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .info { display: flex; gap: 10px; margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); font-size: 14px; }
  details.more { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; }
  details.more summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 15px; list-style: none; display: flex; justify-content: space-between; }
  details.more summary::after { content: "›"; transform: rotate(90deg); transition: transform .2s; font-size: 20px; line-height: 1; }
  details.more[open] summary::after { transform: rotate(-90deg); }
  details.more .body { padding: 0 14px 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .disclaimer { font-size: 13px; color: var(--muted); margin-top: 16px; }
  .ok { color: var(--green); font-weight: 600; }


  .who { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .who.on { display: inline-flex; }
  .who b { color: var(--text); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who button { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; }
  #loginOverlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--bg); overflow: auto; }
  #loginOverlay[hidden] { display: none; }
  #loginOverlay .box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 22px; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
  #loginOverlay h2 { margin: 0 0 4px; font-size: 22px; }
  #loginOverlay p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  #loginOverlay input { width: 100%; margin-bottom: 12px; }
  #loginOverlay .lang { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 8px; }
  #loginOverlay .lang button { border: 1px solid var(--border); background: var(--bg2); color: var(--text); border-radius: 8px; padding: 4px 9px; cursor: pointer; font: inherit; font-size: 13px; }
  #loginOverlay .lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #loginErr { color: var(--red, #c62828); font-size: 14px; min-height: 20px; margin-bottom: 8px; }

  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .hero h1 { font-size: 25px; } }
  @media (max-width: 520px) {
    main { padding: 10px 14px 56px; } .hero { padding: 16px 16px 14px; } .hero h1 { font-size: 22px; }
    .auscult { grid-template-columns: 1fr; } .torso { margin: 0 auto; width: 210px; }
    .lrow { grid-template-columns: 14px 1fr; } .lfile { grid-column: 2; } .fname { max-width: 200px; }
    .headline { font-size: 20px; } .todo { font-size: 17px; } .ico { width: 48px; height: 48px; font-size: 25px; }
    .brand small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media print {
    body { background: #fff; color: #000; } .topbar, #viewForm, .subbar, .actions, #echoBox, .jcard { display: none !important; }
    .card, .verdict { box-shadow: none; border: 1px solid #999; break-inside: avoid; } .cols { grid-template-columns: 1fr; }
    details.more { display: block; } details.more summary { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f74cf"/><stop offset="1" stop-color="#0758AA"/></linearGradient></defs>
        <path d="M24 43C8 31 4 21 4 15 4 9 8.5 5 14 5c4 0 7.500 2.300 10 6 2.500-3.700 6-6 10-6 5.500 0 10 4 10 10 0 6-4 16-20 28z" fill="url(#lg)"/>
        <polyline points="9,24 17,24 20,17 25,32 29,21 32,24 39,24" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>CardioPath AI</b><small data-i="brandSub"></small></div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="uz" aria-pressed="false">UZ</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="who on" id="modelsLink" href="/#/models" data-i="modelsLink" style="color:var(--accent);font-weight:700;text-decoration:none"></a>
      <a class="who on" id="shadowLink" href="/#/shadow" data-i="shadowLink" style="color:var(--accent);font-weight:700;text-decoration:none"></a>
      <span class="who" id="who"><b id="whoName"></b><button type="button" id="logout" data-i="signOut"></button></span>
      <button type="button" class="theme" id="theme" aria-label="Theme"></button>
    </div>
  </header>

  <!-- 1-ekran: forma -->
  <section id="viewForm">
    <div class="info" id="permNote" hidden><span data-i="noPerm"></span></div>
    <div class="hero">
      <svg class="ecg" viewBox="0 0 520 90" aria-hidden="true">
        <path class="line" pathLength="1" d="M0 50H60L72 50 82 22 96 76 108 40 116 50H218"/>
        <path class="heart" d="M260 82C232 62 218 48 218 34 218 22 227 14 238 14c9 0 17 5 22 12 5-7 13-12 22-12 11 0 20 8 20 20 0 14-14 28-42 48z"/>
        <rect class="bar" x="241" y="39" width="3" height="10" rx="1.500"/><rect class="bar" x="248" y="33" width="3" height="22" rx="1.500"/>
        <rect class="bar" x="255" y="27" width="3" height="34" rx="1.500"/><rect class="bar" x="262" y="35" width="3" height="18" rx="1.500"/>
        <rect class="bar" x="269" y="30" width="3" height="28" rx="1.500"/><rect class="bar" x="276" y="38" width="3" height="12" rx="1.500"/>
        <path class="line" pathLength="1" d="M302 50H404L414 50 424 28 436 70 446 44 454 50H520"/>
      </svg>
      <h1 data-i="tagline"></h1>
      <p data-i="heroSub"></p>
      <div class="chips">
        <span class="chip"><i aria-hidden="true">⚡</i><span data-i="chip1"></span></span>
        <span class="chip"><i aria-hidden="true">✓</i><span data-i="chip2"></span></span>
        <span class="chip"><i aria-hidden="true">♥</i><span data-i="chip3"></span></span>
      </div>
      <details class="how"><summary data-i="howTitle"></summary>
        <ol><li data-i="step1"></li><li data-i="step2"></li><li data-i="step3"></li></ol></details>
    </div>

    <button type="button" class="banner" id="lastBanner" hidden></button>

    <form id="form" novalidate>
      <div class="cols">
        <div class="col">
          <section class="card">
            <h2><span data-i="s1"></span><span class="tag req" data-i="required"></span></h2>
            <div class="grid">
              <div><label class="f" for="ref" data-i="ref"></label><input id="ref" type="text" required maxlength="64" data-ph="refPh" autocomplete="off">
                <div class="hint" data-i="refHint" style="margin:4px 0 0"></div></div>
              <div><label class="f" for="actor" data-i="actor"></label><input id="actor" type="text" required maxlength="64" data-ph="actorPh" autocomplete="off"></div>
              <div><label class="f" for="age" data-i="age"></label>
                <div class="age"><input id="age" type="number" inputmode="numeric" min="0" step="1" required>
                  <select id="ageUnit" aria-label="unit"><option value="1" data-i="unitDay"></option><option value="30.44" data-i="unitMonth"></option><option value="365.25" data-i="unitYear" selected></option></select></div></div>
            </div>
          </section>

          <section class="card">
            <h2><span data-i="s2"></span><span class="tag" data-i="optional"></span></h2>
            <p class="hint" data-i="s2hint"></p>
            <div class="grid" style="margin-top:0">
              <div><label class="f" for="rh" data-i="rh"></label><input id="rh" type="number" inputmode="numeric" min="50" max="100" step="1" placeholder="98"></div>
              <div><label class="f" for="foot" data-i="foot"></label><input id="foot" type="number" inputmode="numeric" min="50" max="100" step="1" placeholder="97"></div>
              <div><label class="f" for="attempt" data-i="attempt"></label><select id="attempt"><option value="1">1</option><option value="2">2</option></select></div>
              <div><label class="f" for="resting" data-i="resting"></label><input id="resting" type="number" inputmode="numeric" min="50" max="100" step="1" placeholder="98"></div>
            </div>
          </section>

          <section class="card">
            <h2><span data-i="s3"></span><span class="tag" data-i="optional"></span></h2>
            <p class="hint" data-i="s3hint"></p>
            <div class="flags" id="flags"></div>
          </section>
        </div>

        <div class="col">
          <section class="card">
            <h2><span data-i="s4"></span><span class="tag" data-i="optional"></span></h2>
            <p class="hint" data-i="s4hint"></p>
            <div class="auscult">

    const peak = Math.max(...bars, 1e-6);
    return { dur: audio.duration, bars: bars.map((b) => b / peak) };
  } catch (e) { return null; }
}
function paintLoc(c) {
  const f = $("f_" + c).files[0], s = locState[c], w = $("w_" + c), pt = $("p_" + c);
  $("x_" + c).hidden = !f;
  const short = !!(s && s.dur != null && s.dur < 5);
  pt.dataset.state = !f ? "" : short ? "short" : "ok";
  pt.setAttribute("aria-label", `${c} — ${t("loc." + c)}`);
  if (!f) { w.hidden = true; w.innerHTML = ""; return; }
  w.hidden = false;
  const bars = s && s.bars ? `<svg class="bars" viewBox="0 0 64 20" preserveAspectRatio="none" aria-hidden="true">${s.bars.map((v, i) => `<rect x="${i}" y="${10 - v * 10}" width=".62" height="${Math.max(.7, v * 20)}"/>`).join("")}</svg>` : "";
  const dur = s && s.dur != null ? `<span class="dur">${fmt(s.dur)}</span>` : "";
  const state = short ? `<span class="warn-chip">⚠ ${esc(t("tooShort"))}</span>` : `<span class="ok-chip">✓ ${esc(t("uploaded"))} · ${esc(t("ready"))}</span>`;
  w.innerHTML = `<div class="fname">${esc(f.name)}</div><div class="wrow">${bars}${dur}</div>${state}`;
}
LOCS.forEach((c) => {
  const inp = $("f_" + c);
  inp.addEventListener("change", async () => {
    const f = inp.files[0]; locState[c] = null; paintLoc(c);
    if (f) { const r = await analyzeAudio(f); if (inp.files[0] === f) { locState[c] = r; paintLoc(c); } }
  });
  $("x_" + c).addEventListener("click", () => { inp.value = ""; locState[c] = null; paintLoc(c); });
  $("p_" + c).addEventListener("click", () => inp.click());
});

/* ---- til */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = `CardioPath AI — ${t("tagline")}`;
  document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach((el) => { el.placeholder = t(el.dataset.ph); });
  document.querySelectorAll("[data-html]").forEach((el) => { el.innerHTML = t(el.dataset.html); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("submit").innerHTML = `<span class="wv" aria-hidden="true"><span></span><span></span><span></span><span></span></span> ${esc(t("analyze"))}`;
  LOCS.forEach(paintLoc);
  paintBanner();
  loadFlags();
  if (last) render();
}
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); applyLang(); }));

async function loadFlags() {
  const checked = new Set([...document.querySelectorAll("#flags input:checked")].map((c) => c.value));
  try {
    const flags = await (await fetch(`/screening/red-flags?lang=${lang}`)).json();
    $("flags").innerHTML = Object.entries(flags).map(([code, f]) =>
      `<label class="chk"><input type="checkbox" value="${esc(code)}" ${checked.has(code) ? "checked" : ""}><span>${esc(f.name)}${f.major ? `<span class="major">${{ uz: "jiddiy", ru: "серьёзный", en: "major" }[lang]}</span>` : ""}</span></label>`).join("");
  } catch (e) { /* server o'chiq — yuborishda xabar chiqadi */ }
}
fetch("/health").then((r) => r.json()).then((h) => { health = h; }).catch(() => {});

/* ---- ko'rinishlar */
function show(view) { $("viewForm").hidden = view !== "form"; $("viewResult").hidden = view !== "result"; window.scrollTo({ top: 0 }); }
function paintBanner() { const b = $("lastBanner"); b.hidden = !last; if (last) b.textContent = `${t("viewLast")} · ${last.ref}`; }
$("lastBanner").addEventListener("click", () => show("result"));
$("back").addEventListener("click", () => { show("form"); paintBanner(); });

/* ---- yuborish */
function showErr(msg, detail) {
  $("err").innerHTML = `<div class="card err"><b>${esc(t("errTitle"))}:</b> ${esc(msg)}${detail ? `<details style="margin-top:6px"><summary>${esc(t("more"))}</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(detail)}</pre></details>` : ""}</div>`;
  $("err").scrollIntoView({ behavior: "smooth", block: "center" });
}
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").innerHTML = "";
  const ref = $("ref").value.trim(), actor = $("actor").value.trim(), age = $("age").value;
  if (!ref || !actor || age === "" || Number(age) < 0) return showErr(t("needFields"));
  const rh = $("rh").value, foot = $("foot").value, resting = $("resting").value;
  if (!!rh !== !!foot) return showErr(t("needPair"));
  const flags = [...document.querySelectorAll("#flags input:checked")].map((c) => c.value);
  const files = LOCS.map((c) => ($("f_" + c).files[0] ? [c, $("f_" + c).files[0]] : null)).filter(Boolean);
  const bad = files.find(([, f]) => !/\.wav$/i.test(f.name));
  if (bad) return showErr(`${t("needWav")} ${bad[1].name}`);
  if (!rh && !resting && !flags.length && !files.length) return showErr(t("needAny"));

  const btn = $("submit"), label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `<span class="wv" aria-hidden="true"><span></span><span></span><span></span><span></span></span> ${esc(t("analyzing"))}`;
  try {
    const ep = await fetch("/episodes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ patient_ref: ref, actor }) });
    if (!ep.ok) throw { status: ep.status, detail: await ep.text() };
    const { id } = await ep.json();
    const fd = new FormData();
    fd.append("actor", actor); fd.append("lang", lang);
    fd.append("age_days", String(Math.round(Number(age) * Number($("ageUnit").value))));
    if (rh) { fd.append("right_hand_spo2", rh); fd.append("foot_spo2", foot); fd.append("attempt", $("attempt").value); }
    if (resting) fd.append("resting_spo2", resting);
    fd.append("red_flags", flags.join(","));
    fd.append("research_consent", $("consent").checked ? "true" : "false");
    fd.append("device", $("device").value.trim());
    files.forEach(([c, f]) => fd.append("recordings", f, `${c}.wav`));
    const r = await fetch(`/episodes/${id}/screening`, { method: "POST", body: fd });
    if (!r.ok) throw { status: r.status, detail: await r.text() };
    last = { body: await r.json(), id, ref, at: new Date() };
    echoState = null;
    render(); show("result");
  } catch (err) {
    const s = err && err.status;
    showErr(!s ? t("errNet") : s === 422 ? t("err422") : s === 409 ? t("err409") : t("err500"), s ? `HTTP ${s}\n${err.detail}` : String(err));
  } finally { btn.disabled = false; btn.innerHTML = label; }
});

/* ---- natija */
function render() {
  const { body: b, id, ref, at } = last;
  const p = (b.plain_i18n && b.plain_i18n[lang]) || b.plain;
  const items = p.items.map((i) => `<li class="it lv-${esc(i.level)}"><span class="dot" aria-hidden="true">${ICONS[i.level] || "?"}</span><div><b>${esc(i.title)}</b><div>${esc(i.text)}</div></div></li>`).join("");
  const ai = b.concordance.ai, v = (ai && ai.value) || {};
  const rows = (v.recordings || []).map((r) => `<tr><td>${esc(r.location)}</td><td>${Math.round(r.p_murmur * 100)}%</td><td>${Math.round(r.window_agreement * 100)}%</td><td>${r.n_windows}</td></tr>`).join("");
  const detail = rows ? `<table><tr><th>${esc(t("pt"))}</th><th>${esc(t("chance"))}</th><th>${esc(t("consistency"))}</th><th>${esc(t("windows"))}</th></tr>${rows}</table>` : "";
  const stages = JOURNEY[lang].map((s, n) => `<li class="${n === 0 ? "cur" : ""}"><div class="n">${n + 1}</div>${esc(s)}</li>`).join("");
  const modelLine = health && health.pcg_model ? `<p class="hint" style="margin:8px 0 0">${esc(t("modelOn"))}: ${esc(health.pcg_model.name)} v${esc(health.pcg_model.version)} · ${esc(t("mode"))}</p>` : (health ? `<p class="hint" style="margin:8px 0 0">${esc(t("modelOff"))}</p>` : "");
  const echo = b.saved_for_research ? `
    <section class="card" id="echoBox" style="margin-bottom:16px"><h3>${esc(t("echoTitle"))}</h3><p class="hint">${esc(t("echoHint"))}</p>
      <div class="row"><select id="echoDx" style="max-width:360px">${Object.entries(ECHO_DX).map(([k, n]) => `<option value="${k}">${esc(n[lang])}</option>`).join("")}</select>
        <input id="echoNotes" type="text" maxlength="500" placeholder="${esc(t("echoNotes"))}" style="flex:1;min-width:160px">
        <button type="button" class="btn" id="echoSave">${esc(t("echoSave"))}</button><span id="echoStatus" class="hint" style="margin:0"></span></div></section>` : "";
  $("out").innerHTML = `
    <section class="verdict lv-${esc(p.level)}">
      <div class="vh"><div class="ico" aria-hidden="true">${ICONS[p.level] || "?"}</div>
        <div><p class="headline">${esc(p.headline)}</p><p class="support">${esc(t("support"))}</p></div></div>
      <p class="todo-l">${esc(t("todoL"))}</p><p class="todo">${esc(p.todo)}</p>
      ${p.attention ? `<p class="attn">${esc(p.attention)}</p>` : ""}
      <p class="meta">${esc(t("patient"))}: <b>${esc(ref)}</b> · ${esc(at.toLocaleString(lang === "uz" ? "uz-UZ" : lang === "ru" ? "ru-RU" : "en-GB"))}</p>
    </section>
    <div class="cols">
      <section class="card"><h3>${esc(t("findings"))}</h3><ul class="items">${items}</ul>${modelLine}</section>
      <section class="card jcard"><h3>${esc(t("journeyTitle"))}</h3><ol class="stepper">${stages}</ol>
        <div class="info"><span aria-hidden="true">ℹ</span><span>${esc(t("journeyInfo"))}</span></div>
        ${detail ? `<details class="more"><summary>${esc(t("detailsRow"))}</summary><div class="body">${detail}</div></details>` : ""}</section>
    </div>
    <div style="margin-top:16px">${echo}</div>
    <div class="row actions">
      <button class="btn" type="button" id="again">${esc(t("newPatient"))}</button>
      <button class="btn sec" type="button" id="print">${esc(t("print"))}</button></div>
    <p class="disclaimer">${esc(t("disclaimer"))}</p>`;
  $("again").onclick = () => {
    $("form").reset(); LOCS.forEach((c) => { $("f_" + c).value = ""; locState[c] = null; paintLoc(c); });
    last = null; $("out").innerHTML = ""; $("err").innerHTML = ""; paintBanner(); show("form"); $("ref").focus();
  };
  $("print").onclick = () => window.print();
  if (b.saved_for_research) {
    if (echoState === "ok") $("echoStatus").innerHTML = `<span class="ok">${esc(t("echoSaved"))}</span>`;
    $("echoSave").onclick = async () => {
      const r = await fetch(`/episodes/${id}/echo-diagnosis`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ actor: $("actor").value.trim(), diagnosis: $("echoDx").value, notes: $("echoNotes").value }) });
      echoState = r.ok ? "ok" : "err";
      $("echoStatus").innerHTML = r.ok ? `<span class="ok">${esc(t("echoSaved"))}</span>` : esc(t("echoErr"));
    };
  }
}
applyTheme();
applyLang();
/* ---- kirish (CARDIOPATH_AUTH=on bo'lsa) */
let session = null;
try { session = JSON.parse(sessionStorage.getItem("auth") || "null"); } catch (e) { session = null; }
const rawFetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  const authed = session && !String(url).startsWith("/auth/login");
  if (authed) opts = { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + session.token } };
  return rawFetch(url, opts).then((r) => { if (r.status === 401 && authed) endSession(true); return r; });
};
function saveSession() { try { session ? sessionStorage.setItem("auth", JSON.stringify(session)) : sessionStorage.removeItem("auth"); } catch (e) { /* private mode */ } }
function can(p) { return !session || session.permissions.includes(p); }
function paintSession() {
  $("who").classList.toggle("on", !!session);
  if (session) {
    $("whoName").textContent = `${session.user.display_name || session.user.username} · ${session.user.role}`;
    $("actor").value = session.user.username; $("actor").readOnly = true;      // server baribir haqiqiy foydalanuvchini yozadi
  } else { $("actor").readOnly = false; }
  $("modelsLink").hidden = !can("learning.read");
  $("shadowLink").hidden = !(can("shadow.label") || can("shadow.report"));
  $("permNote").hidden = can("screening.run");
  $("submit").disabled = !can("screening.run");
  if (session) loadFlags();
}
function showLogin(msgKey) {
  $("loginOverlay").hidden = false; $("lgPass").value = "";
  $("loginErr").textContent = msgKey ? t(msgKey) : "";
  setTimeout(() => $("lgUser").focus(), 0);
}
function endSession(expired) { session = null; saveSession(); paintSession(); showLogin(expired ? "sessionEnded" : null); }
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("loginErr").textContent = ""; $("lgGo").disabled = true;
  try {
    const r = await rawFetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("lgUser").value.trim(), password: $("lgPass").value }) });
    if (r.ok) {
      const b = await r.json();
      session = { token: b.token, user: b.user, permissions: b.permissions }; saveSession();
      $("loginOverlay").hidden = true; $("lgPass").value = ""; paintSession();
    } else { $("loginErr").textContent = t(r.status === 429 ? "loginLocked" : "loginBad"); }
  } catch (err) { $("loginErr").textContent = t("loginNet"); }
  $("lgGo").disabled = false;
});
$("logout").addEventListener("click", async () => { try { await fetch("/auth/logout", { method: "POST" }); } catch (e) { /* baribir chiqamiz */ } endSession(false); });
async function initAuth() {
  try {
    const st = await (await rawFetch("/auth/status")).json();
    if (!st.enabled) { session = null; saveSession(); paintSession(); return; }
    if (session) {
      const r = await fetch("/auth/me");
      if (r.ok) { const b = await r.json(); session.user = b.user; session.permissions = b.permissions; saveSession(); paintSession(); return; }
      session = null; saveSession();
    }
    paintSession(); showLogin(null);
  } catch (e) { /* server o'chiq — forma ochiq qoladi, yuborishda xabar chiqadi */ }
}
initAuth();
</script>
